name: flutter_braintree
description: Flutter plugin that wraps the native Braintree SDKs. Enables payments with credit cards, PayPal, Google Pay and more. Supports Android, iOS, and Web.
version: 5.0.0
homepage: https://github.com/pikaju/flutter-braintree

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: "1.15.0"
  web: "1.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.7

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_braintree
        pluginClass: FlutterBraintreePlugin
      ios:
        pluginClass: FlutterBraintreePlugin
      web:
        pluginClass: FlutterBraintreeWebPlugin
        fileName: flutter_braintree_web.dart
