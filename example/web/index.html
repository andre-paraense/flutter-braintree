<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Demonstrates how to use the flutter_braintree plugin">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_braintree_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>flutter_braintree example</title>
  <link rel="manifest" href="manifest.json">

  <!-- Braintree Web Drop-in SDK -->
  <script src="https://js.braintreegateway.com/web/dropin/1.43.0/js/dropin.min.js"></script>

  <!-- Braintree Web Client SDK (for custom credit card tokenization) -->
  <script src="https://js.braintreegateway.com/web/3.101.0/js/client.min.js"></script>

  <!-- Braintree PayPal Checkout SDK (for custom PayPal tokenization) -->
  <script src="https://js.braintreegateway.com/web/3.101.0/js/paypal-checkout.min.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
